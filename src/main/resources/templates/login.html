<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión · Melodic Vault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header class="cabecera-interna">
    <nav class="navbar">
        <div class="logo">MELODIC <span>VAULT</span></div>
		<div class="menu">
		    <a th:href="@{/}">Inicio</a>
		    <a th:href="@{/bandas}">Bandas</a>
		    <a th:href="@{/albumes}">Álbumes</a>
		    <a th:href="@{/canciones}">Canciones</a>
		    <a th:href="@{/acerca}">Acerca de</a>

		    <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Iniciar sesión</a>
		    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="form-salir">
		        <button type="submit">Salir (<span sec:authentication="name">usuario</span>)</button>
		    </form>
		</div>
    </nav>
</header>

<main class="contenedor">

    <section class="titulo-pagina">
        <p class="tag"><i class="bi bi-shield-lock"></i> Acceso</p>
        <h1>Iniciar sesión</h1>
        <p>Ingresa con tu cuenta para administrar el catálogo.</p>
    </section>

    <section class="formulario-vault">
        <div class="form-panel">

            <div class="alert alert-danger" th:if="${param.error}">
                Usuario o contraseña incorrectos.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="row g-4">

                    <div class="col-md-12">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control input-vault"
                               placeholder="admin" required autofocus>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control input-vault"
                               placeholder="••••••••" required>
                    </div>

                </div>

                <div class="form-botones">
                    <a th:href="@{/}" class="btn-cancelar">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-guardar">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </div>
            </form>

        </div>
    </section>

</main>

<footer>
    <p>Melodic Vault - 2026</p>
</footer>

</body>
</html>
