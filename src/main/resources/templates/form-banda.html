<!DOCTYPE html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
	<title th:text="${modo == 'editar'} ? 'Editar Banda · Melodic Vault' : 'Registrar Banda · Melodic Vault'">
	    Registrar Banda · Melodic Vault
	</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header class="cabecera-interna">
    <nav class="navbar">
        <div class="logo">MELODIC <span>VAULT</span></div>
		<div class="menu">
		    <a th:href="@{/}">Inicio</a>
		    <a th:href="@{/bandas}">Bandas</a>
		    <a th:href="@{/albumes}">Álbumes</a>
		    <a th:href="@{/canciones}">Canciones</a>
		    <a th:href="@{/acerca}">Acerca de</a>

		    <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Iniciar sesión</a>
		    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="form-salir">
		        <button type="submit">Salir (<span sec:authentication="name">usuario</span>)</button>
		    </form>
		</div>
    </nav>
</header>

<main class="contenedor">

    <section class="titulo-pagina">
        <p class="tag"><i class="bi bi-vinyl"></i> Nueva entrada</p>
		<h1 th:text="${modo == 'editar'} ? 'Editar banda' : 'Registrar banda'">Registrar banda</h1>
        <p>Agrega una banda al catálogo Melodic Vault.</p>
    </section>

    <section class="formulario-vault">

        <div class="form-panel">

            <div class="form-encabezado">
                <div>
                    <h2><i class="bi bi-music-note-beamed"></i> Datos de la banda</h2>
                    <p>Completa la información principal del artista o agrupación.</p>
                </div>
                <a th:href="@{/bandas}" class="btn-volver">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
            </div>

			<form th:action="@{/bandas/guardar}" th:object="${banda}" method="post">
				<input type="hidden" th:field="*{idBanda}">

                <div class="row g-4">

                    <div class="col-md-6">
                        <label class="form-label">Nombre de la banda</label>
						<input type="text" class="form-control input-vault" th:field="*{nombre}" placeholder="Ej. Dokken">
						<span class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">País</label>
						<input type="text" class="form-control input-vault" th:field="*{pais}" placeholder="Ej. Estados Unidos">
						<span class="text-danger" th:if="${#fields.hasErrors('pais')}" th:errors="*{pais}"></span>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Género principal</label>
						<select class="form-select input-vault" th:field="*{genero}">
						    <option value="">Seleccionar género</option>
						    <option value="Hard Rock">Hard Rock</option>
						    <option value="AOR">AOR</option>
						    <option value="Melodic Hard Rock">Melodic Hard Rock</option>
						    <option value="Glam Metal">Glam Metal</option>
						    <option value="Heavy Metal">Heavy Metal</option>
						    <option value="Power Metal">Power Metal</option>
						    <option value="Metal Extremo">Metal Extremo</option>
						</select>
						<span class="text-danger" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></span>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Año de formación</label>
						<input type="number" class="form-control input-vault" th:field="*{anioFormacion}" placeholder="1978">
						<span class="text-danger" th:if="${#fields.hasErrors('anioFormacion')}" th:errors="*{anioFormacion}"></span>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Estado</label>
						<select class="form-select input-vault" th:field="*{estado}">
						    <option value="Activa">Activa</option>
						    <option value="Separada">Separada</option>
						    <option value="En pausa">En pausa</option>
						</select>
						<span class="text-danger" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></span>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">URL de imagen</label>
						<input type="text" class="form-control input-vault" th:field="*{imagenUrl}" placeholder="https://imagen-de-la-banda.com/foto.jpg">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Descripción</label>
						<textarea class="form-control input-vault" rows="5"
						          th:field="*{descripcion}"
						          placeholder="Breve reseña de la banda, sonido, época o importancia dentro del género..."></textarea>
                    </div>

                </div>

                <div class="form-botones">
                    <a th:href="@{/bandas}" class="btn-cancelar">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>

					<button type="submit" class="btn-guardar">
					    <i class="bi bi-save"></i>
					    <span th:text="${modo == 'editar'} ? 'Guardar cambios' : 'Guardar banda'">Guardar banda</span>
					</button>
                </div>

            </form>

        </div>

    </section>

</main>

<footer>
    <p>Melodic Vault - 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
