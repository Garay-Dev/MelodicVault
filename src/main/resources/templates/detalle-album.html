<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${album.titulo} + ' · Melodic Vault'">Detalle Álbum · Melodic Vault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<header class="cabecera-interna">
    <nav class="navbar">
        <div class="logo">MELODIC <span>VAULT</span></div>
        <div class="menu">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/bandas}">Bandas</a>
            <a th:href="@{/albumes}">Álbumes</a>
            <a th:href="@{/acerca}">Acerca de</a>
        </div>
    </nav>
</header>

<main class="contenedor">

    <section class="detalle-album-layout">

        <aside class="detalle-album-cover">
			<div class="album-cover detalle-cover">
			    <img th:if="${album.portadaUrl != null && !album.portadaUrl.isEmpty()}"
			         th:src="${album.portadaUrl}"
			         th:alt="${album.titulo}">

			    <div class="album-portada dokken-cover"
			         th:if="${album.portadaUrl == null || album.portadaUrl.isEmpty()}">
			        <span th:text="${album.titulo}">Álbum</span>
			    </div>
			</div>
        </aside>

        <section class="detalle-album-info">
            <p class="tag">
                <i class="bi bi-disc"></i>
                <span th:text="${album.tipo}">Studio Album</span>
            </p>

            <h1 th:text="${album.titulo}">Título del álbum</h1>

            <h3>
                <span th:text="${album.banda.nombre}">Banda</span>
                ·
                <span th:text="${album.anio}">1984</span>
            </h3>

            <div class="datos-album detalle-datos">
                <span>Rating: <span th:text="${album.rating}">9.0</span></span>
                <span>Formato: <span th:text="${album.formato}">CD</span></span>
                <span>Género: <span th:text="${album.banda.genero}">Hard Rock</span></span>
                <span>País: <span th:text="${album.banda.pais}">País</span></span>
            </div>

            <p class="descripcion-card" th:text="${album.descripcion}">
                Descripción del álbum.
            </p>

            <div class="acciones-card">
                <a th:href="@{/albumes/editar/{id}(id=${album.idAlbum})}" class="btn-editar">
                    Editar álbum
                </a>

                <a th:href="@{/albumes}" class="btn-secundario">
                    Volver a álbumes
                </a>

                <a th:href="@{/bandas/detalle/{id}(id=${album.banda.idBanda})}" class="btn-principal">
                    Ver banda
                </a>
            </div>
        </section>

    </section>

</main>

<footer>
    <p>Melodic Vault - 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
