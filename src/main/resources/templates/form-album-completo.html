<section class="titulo-pagina">
    <p class="tag"><i class="bi bi-disc"></i> Registro completo</p>
    <h1>Registrar álbum con canciones</h1>
    <p>Se guarda todo en una sola transacción: si una pista es inválida, no se guarda nada.</p>
</section>

<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

<section class="formulario-vault">
    <div class="form-panel">
        <form th:action="@{/albumes/completo/guardar}" th:object="${form}" method="post">

            <h2><i class="bi bi-vinyl"></i> Datos del álbum</h2>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Título</label>
                    <input type="text" class="form-control input-vault" th:field="*{album.titulo}">
                    <span class="text-danger" th:if="${#fields.hasErrors('album.titulo')}" th:errors="*{album.titulo}"></span>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Banda</label>
                    <select class="form-select input-vault" th:field="*{album.banda}">
                        <option value="">Seleccionar banda</option>
                        <option th:each="b : ${bandas}" th:value="${b.idBanda}" th:text="${b.nombre}"></option>
                    </select>
                    <span class="text-danger" th:if="${#fields.hasErrors('album.banda')}" th:errors="*{album.banda}"></span>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Año</label>
                    <input type="number" class="form-control input-vault" th:field="*{album.anio}">
                    <span class="text-danger" th:if="${#fields.hasErrors('album.anio')}" th:errors="*{album.anio}"></span>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Tipo</label>
                    <select class="form-select input-vault" th:field="*{album.tipo}">
                        <option value="Studio Album">Studio Album</option>
                        <option value="Live Album">Live Album</option>
                        <option value="EP">EP</option>
                        <option value="Compilation">Compilation</option>
                        <option value="Single">Single</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Rating</label>
                    <input type="number" step="0.1" min="0" max="10" class="form-control input-vault" th:field="*{album.rating}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Formato</label>
                    <select class="form-select input-vault" th:field="*{album.formato}">
                        <option value="CD">CD</option>
                        <option value="Vinilo">Vinilo</option>
                        <option value="Cassette">Cassette</option>
                        <option value="Digital">Digital</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">URL de portada</label>
                    <input type="text" class="form-control input-vault" th:field="*{album.portadaUrl}">
                </div>
            </div>

            <h2 class="mt-5"><i class="bi bi-music-note-list"></i> Canciones</h2>
            <p>Deja vacías las filas que no uses. Si no pones número de pista, se asigna en orden.</p>

            <div class="row g-3 mb-2" th:each="c, i : *{canciones}">
                <div class="col-md-2">
                    <input type="number" class="form-control input-vault" placeholder="Pista"
                           th:field="*{canciones[__${i.index}__].numeroPista}">
                </div>
                <div class="col-md-7">
                    <input type="text" class="form-control input-vault" placeholder="Título de la canción"
                           th:field="*{canciones[__${i.index}__].titulo}">
                </div>
                <div class="col-md-3">
                    <input type="number" min="0" class="form-control input-vault" placeholder="Duración (seg)"
                           th:field="*{canciones[__${i.index}__].duracionSegundos}">
                </div>
            </div>

            <div class="form-botones">
                <a th:href="@{/albumes}" class="btn-cancelar"><i class="bi bi-x-circle"></i> Cancelar</a>
                <button type="submit" class="btn-guardar"><i class="bi bi-save"></i> Guardar todo</button>
            </div>
        </form>
    </div>
</section>
